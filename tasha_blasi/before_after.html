<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasha Blasi — Before/After Automation</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .transition-all { transition: all 0.3s ease; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // =========================================================
    // DATA — Tasha Blasi / IVF Uncovered, audit July 2026
    // Source: Tasha_Blasi_ROI_Analysis.md (P1–P10)
    // =========================================================
    const CLIENT = {
      name: "Tasha Blasi — IVF Uncovered",
      industry: "Fertility & IVF Coaching",
      auditDate: "July 2026",
    };

    // Summary stats
    const SUMMARY = {
      hoursFreedPerWeek: 24.3,
      annualSavings: "$146,875",
      processesAutomated: 10,
      paybackMonths: 1.5,
    };

    // 8 highest-savings process transformations (P1, P3, P2, P5, P4, P9, P8, P6)
    const PROCESSES = [
      {
        name: "Email Triage & Client Email",
        icon: "📧",
        category: "Servicing",
        current: { label: "Tasha answers everything herself", value: "8 hrs/wk", unit: "owner time", cost: "$60,000/yr" },
        after:   { label: "Email agent drafts in her voice",  value: "3.2 hrs/wk", unit: "review only", cost: "$24,000/yr" },
        savings: "$36,000/yr",
        hoursWeek: 8,
      },
      {
        name: "Video Editing & Post-Production",
        icon: "🎬",
        category: "Content",
        current: { label: "Tasha edits her own videos", value: "6 hrs/wk", unit: "owner time", cost: "$45,000/yr" },
        after:   { label: "AI edit + EA review + approval", value: "1.2 hrs/wk", unit: "approval only", cost: "$9,000/yr" },
        savings: "$36,000/yr",
        hoursWeek: 6,
      },
      {
        name: "Content Research & Scripting",
        icon: "📝",
        category: "Content",
        current: { label: "Manual ideation, inconsistent posting", value: "3 hrs/wk", unit: "owner time", cost: "$22,500/yr" },
        after:   { label: "Outlier research + scripts in her voice", value: "0.9 hrs/wk", unit: "review only", cost: "$6,750/yr" },
        savings: "$15,750/yr",
        hoursWeek: 3,
      },
      {
        name: "Group-Client Q&A Tracking",
        icon: "👥",
        category: "Servicing",
        current: { label: "Untracked questions, no record", value: "3 hrs/wk", unit: "owner time", cost: "$22,500/yr" },
        after:   { label: "Logged, tracked, answered once", value: "0.9 hrs/wk", unit: "owner time", cost: "$6,750/yr" },
        savings: "$15,750/yr",
        hoursWeek: 3,
      },
      {
        name: "Treatment-Window Texting",
        icon: "💬",
        category: "Servicing · HIPAA",
        current: { label: "Personal cell, always on call", value: "5 hrs/wk", unit: "owner time", cost: "$37,500/yr" },
        after:   { label: "Compliant channel + drafted replies", value: "3 hrs/wk", unit: "owner time", cost: "$22,500/yr" },
        savings: "$15,000/yr",
        hoursWeek: 5,
      },
      {
        name: "Podcast Production & Guest Booking",
        icon: "🎙️",
        category: "Content",
        current: { label: "Stalled since April 27", value: "0 episodes", unit: "since Mar 2026", cost: "$15,000/yr" },
        after:   { label: "Produced + PR agent books guests/shows", value: "0.8 hrs/wk", unit: "record only", cost: "$6,000/yr" },
        savings: "$9,000/yr",
        hoursWeek: 2,
      },
      {
        name: "Financial Dashboard",
        icon: "📊",
        category: "Admin",
        current: { label: "Hand-built, manually updated", value: "1 hr/wk", unit: "owner time", cost: "$7,500/yr" },
        after:   { label: "Self-updating dashboard", value: "Real-time", unit: "always on", cost: "$1,125/yr" },
        savings: "$6,375/yr",
        hoursWeek: 1,
      },
      {
        name: "Sales Follow-Up",
        icon: "🔄",
        category: "Sales",
        current: { label: "Ad-hoc, most leads never followed up", value: "1 hr/wk", unit: "sporadic", cost: "$7,500/yr" },
        after:   { label: "Automated sequences in her voice", value: "0.2 hrs/wk", unit: "review only", cost: "$1,500/yr" },
        savings: "$6,000/yr",
        hoursWeek: 1,
      },
    ];

    // Financial summary
    const FINANCIALS = {
      implementationCost: "$18,000 (paid)",
      paybackPeriod: "~1.5 months",
      year1ROI: "672%",
      year3NetBenefit: "$529,906",
    };

    // 3-phase timeline (shown in "after" view)
    const PHASES = [
      { phase: "Phase 1", name: "Content Machine + Email Agent", timeline: "Month 1", cost: "$7,000", savings: "$87,750/yr", items: ["Video editing pipeline", "Research & scripting", "Email triage agent"] },
      { phase: "Phase 2", name: "HIPAA Client Systems", timeline: "Month 2", cost: "$7,000", savings: "$41,125/yr", items: ["CRM + client tracking", "Treatment texting", "Group Q&A", "Sales follow-up", "DM qualification"] },
      { phase: "Phase 3", name: "Dashboard + Podcast/PR", timeline: "Month 3", cost: "$4,000", savings: "$18,000/yr", items: ["Financial dashboard", "Podcast & guest booking", "Scheduling"] },
    ];

    // =========================================================
    // COMPONENT
    // =========================================================
    const { useState } = React;

    function StatBadge({ label, value, accent }) {
      return (
        <div className={`rounded-xl p-4 text-center border-2 ${accent}`}>
          <div className="text-2xl font-bold">{value}</div>
          <div className="text-xs mt-1 opacity-75">{label}</div>
        </div>
      );
    }

    function ProcessCard({ proc, isAfter }) {
      const state = isAfter ? proc.after : proc.current;
      const theme = isAfter
        ? { card: "bg-green-950 border-green-700", badge: "bg-green-800 text-green-200", value: "text-green-400", savings: "text-green-300" }
        : { card: "bg-red-950 border-red-800",   badge: "bg-red-900 text-red-200",   value: "text-red-400",   savings: "text-gray-400" };

      return (
        <div className={`rounded-xl border p-4 ${theme.card} flex flex-col gap-2`}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-xl">{proc.icon}</span>
              <span className="font-semibold text-white text-sm">{proc.name}</span>
            </div>
            <span className={`text-xs px-2 py-0.5 rounded-full ${theme.badge}`}>{proc.category}</span>
          </div>
          <div className="text-xs text-gray-400">{state.label}</div>
          <div className={`text-2xl font-bold ${theme.value}`}>{state.value}</div>
          <div className="text-xs text-gray-500">{state.unit}</div>
          <div className="flex items-center justify-between mt-1 pt-2 border-t border-gray-700">
            <span className="text-xs text-gray-400">Annual cost</span>
            <span className={`text-sm font-semibold ${isAfter ? "text-green-400" : "text-red-400"}`}>{state.cost}</span>
          </div>
          {isAfter && (
            <div className="flex items-center justify-between">
              <span className="text-xs text-gray-400">Savings</span>
              <span className={`text-sm font-bold ${theme.savings}`}>{proc.savings}</span>
            </div>
          )}
        </div>
      );
    }

    function PhaseCard({ phase }) {
      const colors = { "Phase 1": "border-teal-500", "Phase 2": "border-blue-500", "Phase 3": "border-purple-500" };
      const bg    = { "Phase 1": "bg-teal-900",      "Phase 2": "bg-blue-900",     "Phase 3": "bg-purple-900" };
      return (
        <div className={`rounded-xl border-2 p-4 bg-gray-900 ${colors[phase.phase]}`}>
          <div className="flex items-center gap-2 mb-2">
            <span className={`text-xs font-bold px-2 py-0.5 rounded-full text-white ${bg[phase.phase]}`}>{phase.phase}</span>
            <span className="text-sm font-semibold text-white">{phase.name}</span>
            <span className="text-xs text-gray-400 ml-auto">{phase.timeline}</span>
          </div>
          <div className="flex gap-4 text-xs mb-3">
            <div><span className="text-gray-400">Allocation: </span><span className="text-white font-semibold">{phase.cost}</span></div>
            <div><span className="text-gray-400">Savings: </span><span className="text-green-400 font-semibold">{phase.savings}</span></div>
          </div>
          <div className="flex flex-wrap gap-1">
            {phase.items.map(item => (
              <span key={item} className="text-xs bg-gray-800 text-gray-300 px-2 py-0.5 rounded">{item}</span>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [isAfter, setIsAfter] = useState(false);

      return (
        <div className="min-h-screen bg-gray-950 text-white">

          {/* Header */}
          <div className={`py-5 px-6 ${isAfter ? "bg-green-900" : "bg-red-900"} transition-all`}>
            <div className="max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-4">
              <div>
                <div className="text-xs text-gray-300 mb-0.5">Crewless — Automation Audit</div>
                <h1 className="text-2xl font-bold">{CLIENT.name}</h1>
                <div className="text-sm text-gray-300">{CLIENT.industry} | {CLIENT.auditDate}</div>
              </div>
              <button
                onClick={() => setIsAfter(!isAfter)}
                className={`px-6 py-3 rounded-xl font-bold text-sm transition-all shadow-lg
                  ${isAfter
                    ? "bg-green-500 hover:bg-green-400 text-white"
                    : "bg-red-500 hover:bg-red-400 text-white"}`}
              >
                {isAfter ? "✅ Showing: After Automation" : "🔴 Showing: Current State"}
                <span className="ml-2 text-xs opacity-75">(click to toggle)</span>
              </button>
            </div>
          </div>

          {/* Summary Stats */}
          <div className="max-w-7xl mx-auto px-6 py-6">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
              <StatBadge
                label="Hours Freed / Week"
                value={`${SUMMARY.hoursFreedPerWeek} hrs`}
                accent={isAfter ? "border-green-600 text-green-300 bg-green-950" : "border-gray-600 text-gray-400 bg-gray-900"}
              />
              <StatBadge
                label="Annual Savings"
                value={SUMMARY.annualSavings}
                accent={isAfter ? "border-green-600 text-green-300 bg-green-950" : "border-gray-600 text-gray-400 bg-gray-900"}
              />
              <StatBadge
                label="Processes Automated"
                value={`${SUMMARY.processesAutomated}`}
                accent={isAfter ? "border-green-600 text-green-300 bg-green-950" : "border-gray-600 text-gray-400 bg-gray-900"}
              />
              <StatBadge
                label="Payback Period"
                value={`~${SUMMARY.paybackMonths} mo`}
                accent={isAfter ? "border-green-600 text-green-300 bg-green-950" : "border-gray-600 text-gray-400 bg-gray-900"}
              />
            </div>

            {/* Section Label */}
            <div className="flex items-center gap-3 mb-4">
              <div className={`w-3 h-3 rounded-full ${isAfter ? "bg-green-500" : "bg-red-500"}`}></div>
              <h2 className="text-lg font-bold">
                {isAfter ? "After Automation — Projected State" : "Current State — Manual Operations"}
              </h2>
            </div>

            {/* Process Cards Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              {PROCESSES.map((proc) => (
                <ProcessCard key={proc.name} proc={proc} isAfter={isAfter} />
              ))}
            </div>

            {/* Financial Impact */}
            <div className="rounded-2xl border border-gray-700 bg-gray-900 p-6 mb-6">
              <h3 className="text-base font-bold mb-4 text-gray-200">Financial Impact</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {[
                  { label: "Investment", value: FINANCIALS.implementationCost, color: "text-yellow-400" },
                  { label: "Payback Period",       value: FINANCIALS.paybackPeriod,      color: "text-blue-400" },
                  { label: "Year 1 ROI",           value: FINANCIALS.year1ROI,           color: "text-green-400" },
                  { label: "3-Year Net Benefit",   value: FINANCIALS.year3NetBenefit,    color: "text-green-300" },
                ].map(({ label, value, color }) => (
                  <div key={label} className="text-center">
                    <div className={`text-xl font-bold ${color}`}>{value}</div>
                    <div className="text-xs text-gray-400 mt-1">{label}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Implementation Timeline — after view only */}
            {isAfter && (
              <div>
                <h3 className="text-base font-bold mb-4 text-gray-200">Implementation Timeline — 90 Days</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {PHASES.map((phase) => (
                    <PhaseCard key={phase.phase} phase={phase} />
                  ))}
                </div>
              </div>
            )}

            {/* Footer */}
            <div className="mt-8 pt-4 border-t border-gray-800 flex items-center justify-between text-xs text-gray-500">
              <span>Prepared by Crewless | runcrewless.com</span>
              <span>CONFIDENTIAL</span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
