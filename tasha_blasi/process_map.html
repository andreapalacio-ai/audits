<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasha Blasi — Process Map</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .dashed-border { border: 2px dashed #ef4444 !important; background: transparent !important; }
    .node-btn { cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
    .node-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .node-btn.selected { outline: 3px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // =========================================================
    // DATA — Tasha Blasi / IVF Uncovered, audit July 2026
    // Sources: Tasha_Blasi_Operations_Analysis.md, Tasha_Blasi_ROI_Analysis.md (P1–P10)
    // =========================================================
    const CLIENT = {
      name: "Tasha Blasi — IVF Uncovered",
      industry: "Fertility & IVF Coaching",
    };

    const LIFECYCLE_COLUMNS = [
      {
        id: "acquisition",
        label: "Acquisition",
        icon: "🎯",
        nodes: [
          {
            id: "formstack-quiz",
            name: "Resource Navigator Quiz",
            status: "missing",
            time: "BROKEN",
            savings: null,
            description: "The homepage's primary CTA (Formstack quiz) returns a 404 error. Every visitor who clicks it hits a dead end. Verified July 18, 2026.",
            action: "URGENT: restore or replace the quiz. This is live lead loss on the main conversion path.",
          },
          {
            id: "site-capture",
            name: "Site Analytics & Email Capture",
            status: "missing",
            time: "N/A",
            savings: null,
            description: "No analytics, no pixel, no email capture anywhere on the single-page Showit site. Traffic and conversion are invisible; visitors leave no trace.",
            action: "Install analytics + pixel, add email capture wired to the new CRM and nurture system.",
          },
          {
            id: "podcast",
            name: "Podcast (IVF Uncovered)",
            status: "critical",
            time: "2 hrs/wk",
            savings: "$9,000/yr",
            description: "167 episodes, 4.9★ — and stalled since March 31, 2026. Tasha calls it the needle-mover for leads. P9.",
            action: "Restart with produced pipeline + PR agent booking guest spots and guests.",
          },
          {
            id: "video-editing",
            name: "Video Editing & Post-Production",
            status: "automate",
            time: "6 hrs/wk",
            savings: "$36,000/yr",
            description: "Tasha edits her own videos. Highest-value owner hours going to production work. P1.",
            action: "Content machine: AI edit (silences, captions, repeats) + EA review + Tasha approval.",
          },
          {
            id: "content-research",
            name: "Content Research & Scripting",
            status: "automate",
            time: "3 hrs/wk",
            savings: "$15,750/yr",
            description: "Manual ideation; posting inconsistent while she is in delivery mode. All leads come from social. P2.",
            action: "Outlier/competitor research → scripts in her voice → daily publishing across her platforms.",
          },
          {
            id: "dm-qualification",
            name: "DM Lead Qualification",
            status: "automate",
            time: "5 hrs/wk (EA)",
            savings: "$4,375/yr",
            description: "EA manually reads DMs to identify where leads live (spend qualifier). P7.",
            action: "Automate location/intent qualification with routing to the CRM pipeline.",
          },
        ],
      },
      {
        id: "onboarding",
        label: "Onboarding",
        icon: "🚀",
        nodes: [
          {
            id: "crm",
            name: "CRM / Lead Database",
            status: "missing",
            time: "N/A",
            savings: null,
            description: "No CRM found on either call or in research. Leads live in DMs, texts, and Tasha's head — a stated source of overwhelm and lost sleep.",
            action: "CRITICAL: HIPAA-capable CRM as the spine of the build. Every lead and client gets a record and a stage.",
          },
          {
            id: "sales-followup",
            name: "Sales Follow-Up",
            status: "automate",
            time: "1 hr/wk",
            savings: "$6,000/yr",
            description: "Her words: after a sales call, \"how am I following up? I'm not.\" No sequences exist. P6.",
            action: "Automated post-call follow-up sequences in her voice, with owner alerts on replies.",
          },
          {
            id: "client-onboarding",
            name: "New-Client Intake",
            status: "manual",
            time: "Ad-hoc",
            savings: null,
            description: "Private clients pay $4,800 (group $2,800) and onboarding is handled personally, ad-hoc, with no standard intake path.",
            action: "Standardize intake through the client portal: forms, documents, expectations, first steps.",
          },
        ],
      },
      {
        id: "servicing",
        label: "Servicing",
        icon: "⚙️",
        nodes: [
          {
            id: "email-triage",
            name: "Email Triage & Client Email",
            status: "automate",
            time: "8 hrs/wk",
            savings: "$36,000/yr",
            description: "Largest single time block. Tasha answers client and business email herself, including 11 PM emails to clients in treatment. P3.",
            action: "Email agent trained on her corpus drafts replies in her voice; she reviews and sends.",
          },
          {
            id: "treatment-texting",
            name: "Treatment-Window Texting",
            status: "warning",
            time: "5 hrs/wk",
            savings: "$15,000/yr",
            description: "~10 private clients in treatment text her personal phone and need fast answers (10-day windows, results every ~3 days). Health details over unsecured SMS. P4.",
            action: "HIPAA-compliant messaging channel with drafted responses and escalation to Tasha. Human judgment stays in the loop.",
          },
          {
            id: "group-qa",
            name: "Group-Client Q&A Tracking",
            status: "warning",
            time: "3 hrs/wk",
            savings: "$15,750/yr",
            description: "Her words: \"this is a mess, I haven't written it down.\" Group client questions answered ad-hoc with no record. P5.",
            action: "Log every Q&A to the client record; build a searchable answer base that feeds Tasha AI.",
          },
          {
            id: "financial-dashboard",
            name: "Financial Dashboard",
            status: "automate",
            time: "1 hr/wk",
            savings: "$6,375/yr",
            description: "She hand-built a dashboard and updates it manually. Wants it \"self-doing.\" P8.",
            action: "Auto-refreshing dashboard fed by her payment and money data sources.",
          },
          {
            id: "scheduling",
            name: "Scheduling & Calendar",
            status: "automate",
            time: "3 hrs/wk (EA)",
            savings: "$2,625/yr",
            description: "EA manages calendar and booking back-and-forth by hand. P10.",
            action: "Self-serve booking + automated confirmations and reminders.",
          },
        ],
      },
      {
        id: "retention",
        label: "Retention",
        icon: "🔄",
        nodes: [
          {
            id: "client-success",
            name: "Client-Success Engine",
            status: "missing",
            time: "N/A",
            savings: null,
            description: "Her words: \"we don't know where client success is.\" No stage tracking; nobody knows where every client stands without asking Tasha.",
            action: "Stage-tracked client journey in the CRM/portal: everyone knows who is where, nothing gets missed.",
          },
          {
            id: "testimonials",
            name: "Testimonial & Story Harvesting",
            status: "missing",
            time: "N/A",
            savings: null,
            description: "Hundreds of testimonials, baby photos, and Path to Parenthood interviews sit unused. Her words: \"I'm doing nothing with them.\"",
            action: "Harvest engine: collect, tag, and route stories into content, sales follow-up, and the site.",
          },
          {
            id: "lead-nurture",
            name: "Warm-Lead Nurture Community",
            status: "missing",
            time: "N/A",
            savings: null,
            description: "She wants a free community to nurture the leads already coming in (\"I have so many leads... I'm not nurturing them\"). Platform undecided (not Circle).",
            action: "Stand up the nurture community + sequences feeding group and private programs. Conservative revenue upside modeled at $28,800/yr in the ROI analysis.",
          },
        ],
      },
      {
        id: "revenue",
        label: "Revenue Opportunities",
        icon: "💰",
        nodes: [
          {
            id: "freed-capacity",
            name: "Freed Capacity → Content & Sales",
            status: "automate",
            time: "18.7 hrs/wk freed",
            savings: "$140,250/yr capacity",
            description: "Owner hours drop from 29 to 10.3 per week (at the $150/hr opportunity-cost rate used across this audit). That capacity goes back to content, podcasting, and selling — the activities that made her last three strong months.",
            action: "Redirect freed hours to the lead engine: daily content, restarted podcast, stages, community.",
          },
          {
            id: "quiz-recovery",
            name: "Fix Broken Lead Capture",
            status: "critical",
            time: "Immediate",
            savings: null,
            description: "Every homepage visitor clicking the quiz today is lost. Restoring capture converts existing traffic she already earns from ~11K IG followers, YouTube, and the book.",
            action: "Phase 1, week 1: repair the funnel before spending a single new hour on traffic.",
          },
          {
            id: "book-funnel",
            name: "Book → Client Pipeline",
            status: "manual",
            time: "Untracked",
            savings: null,
            description: "\"Kiss Your Baby Sooner\" is live on Amazon with no tracked path from reader to consult. No email capture connects the book audience to her programs.",
            action: "Wire book bonuses/readers into the nurture community and CRM.",
          },
          {
            id: "group-margin",
            name: "Group Program Capacity",
            status: "normal",
            time: "~6 clients",
            savings: null,
            description: "Group at $2,800 (\"I know it's not enough\" — her words) with messy tracking caps how many members she can serve well.",
            action: "Once tracking and Q&A systems land, group capacity can grow without service quality dropping.",
          },
        ],
      },
    ];

    // Tool integrations
    const TOOLS = [
      { name: "Showit Website", status: "standalone", note: "Single page, no capture, no analytics" },
      { name: "Formstack Quiz", status: "missing", note: "Primary CTA returns 404 — broken" },
      { name: "Libsyn (Podcast)", status: "standalone", note: "Stalled since Mar 31, 2026" },
      { name: "Amazon (Book)", status: "standalone", note: "No reader → client path" },
      { name: "IG / YouTube / FB / X", status: "manual", note: "Hand-posted; she edits videos herself" },
      { name: "Texting (personal phone)", status: "manual", note: "PHI over SMS — HIPAA risk" },
      { name: "Financial Dashboard", status: "manual", note: "Hand-built, manually updated" },
      { name: "CRM", status: "missing", note: "Does not exist — build spine" },
    ];

    // =========================================================
    // COMPONENT
    // =========================================================
    const { useState } = React;

    const STATUS_CONFIG = {
      critical:  { bg: "bg-red-500",   text: "text-white",       label: "Critical",  dot: "bg-red-500" },
      automate:  { bg: "bg-green-500", text: "text-white",       label: "Automate",  dot: "bg-green-500" },
      warning:   { bg: "bg-yellow-500", text: "text-gray-900",   label: "Warning",   dot: "bg-yellow-500" },
      missing:   { bg: "bg-transparent border-2 border-red-500 border-dashed", text: "text-red-400", label: "Missing", dot: "bg-red-200" },
      manual:    { bg: "bg-blue-500",  text: "text-white",       label: "Manual",    dot: "bg-blue-500" },
      normal:    { bg: "bg-gray-500",  text: "text-white",       label: "Normal",    dot: "bg-gray-500" },
    };

    const TOOL_STATUS = {
      integrated: { color: "text-green-400", icon: "✓", label: "Integrated" },
      standalone: { color: "text-yellow-400", icon: "⚠", label: "Standalone" },
      manual:     { color: "text-orange-400", icon: "⚠", label: "Manual" },
      missing:    { color: "text-red-400",    icon: "✗", label: "Broken / Not Present" },
    };

    function NodeButton({ node, isSelected, onClick }) {
      const cfg = STATUS_CONFIG[node.status] || STATUS_CONFIG.normal;
      return (
        <button
          onClick={onClick}
          className={`node-btn w-full rounded-lg p-3 text-left ${cfg.bg} ${cfg.text} ${isSelected ? "selected" : ""}`}
        >
          <div className="font-semibold text-xs leading-tight">{node.name}</div>
          <div className="text-xs mt-1 opacity-75">{node.time}</div>
          {node.savings && (
            <div className={`text-xs mt-1 font-bold ${node.status === "missing" ? "text-red-300" : "opacity-90"}`}>
              {node.savings}
            </div>
          )}
        </button>
      );
    }

    function DetailPanel({ node, onClose }) {
      if (!node) return null;
      const cfg = STATUS_CONFIG[node.status] || STATUS_CONFIG.normal;
      return (
        <div className="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-700 p-5 z-50 shadow-2xl">
          <div className="max-w-4xl mx-auto">
            <div className="flex items-start justify-between mb-3">
              <div className="flex items-center gap-3">
                <span className={`px-2 py-0.5 rounded text-xs font-bold ${cfg.bg} ${cfg.text}`}>{cfg.label}</span>
                <h3 className="text-lg font-bold text-white">{node.name}</h3>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-xl font-bold ml-4">×</button>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <div className="text-xs text-gray-400 mb-1">Current State</div>
                <p className="text-sm text-gray-200">{node.description}</p>
              </div>
              <div>
                <div className="text-xs text-gray-400 mb-1">Time Investment</div>
                <p className="text-sm font-bold text-white">{node.time}</p>
              </div>
              <div>
                <div className="text-xs text-gray-400 mb-1">Recommended Action</div>
                <p className="text-sm text-green-300">{node.action}</p>
                {node.savings && (
                  <p className="text-xs text-green-400 font-bold mt-1">Potential: {node.savings}</p>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [selectedNode, setSelectedNode] = useState(null);

      const handleNodeClick = (node) => {
        setSelectedNode(prev => prev?.id === node.id ? null : node);
      };

      return (
        <div className="min-h-screen bg-gray-950 text-white pb-40">

          {/* Header */}
          <div className="bg-gray-900 border-b border-gray-700 px-6 py-4">
            <div className="max-w-full mx-auto flex items-center justify-between flex-wrap gap-2">
              <div>
                <div className="text-xs text-gray-400">Crewless — Automation Audit</div>
                <h1 className="text-xl font-bold">{CLIENT.name} — Process Map</h1>
                <div className="text-xs text-gray-400 mt-0.5">{CLIENT.industry} | Click any node for details</div>
              </div>
              {/* Legend */}
              <div className="flex flex-wrap gap-3 text-xs">
                {Object.entries(STATUS_CONFIG).map(([key, cfg]) => (
                  <div key={key} className="flex items-center gap-1">
                    <div className={`w-2.5 h-2.5 rounded-full ${cfg.dot}`}></div>
                    <span className="text-gray-300">{cfg.label}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Process Map Grid */}
          <div className="px-4 py-6 overflow-x-auto">
            <div className="flex gap-4 min-w-max pb-4" style={{ minWidth: "900px" }}>
              {LIFECYCLE_COLUMNS.map((col) => (
                <div key={col.id} className="flex-1 min-w-44">
                  {/* Column Header */}
                  <div className="text-center mb-4">
                    <div className="text-2xl mb-1">{col.icon}</div>
                    <div className="font-bold text-sm text-white">{col.label}</div>
                    <div className="h-0.5 bg-gray-700 mt-2 mx-4 rounded"></div>
                  </div>
                  {/* Nodes */}
                  <div className="flex flex-col gap-3">
                    {col.nodes.map((node) => (
                      <NodeButton
                        key={node.id}
                        node={node}
                        isSelected={selectedNode?.id === node.id}
                        onClick={() => handleNodeClick(node)}
                      />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Data Systems */}
          <div className="px-4 pb-4">
            <div className="border border-gray-700 rounded-xl p-4 bg-gray-900">
              <h3 className="font-bold text-sm mb-3 text-gray-200">Data Systems & Integration Status</h3>
              <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
                {TOOLS.map((tool) => {
                  const ts = TOOL_STATUS[tool.status] || TOOL_STATUS.standalone;
                  return (
                    <div key={tool.name} className="bg-gray-800 rounded-lg p-3">
                      <div className="font-semibold text-xs text-white leading-tight">{tool.name}</div>
                      <div className={`text-xs mt-1 font-bold ${ts.color}`}>{ts.icon} {ts.label}</div>
                      <div className="text-xs text-gray-500 mt-1 leading-tight">{tool.note}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Footer */}
          <div className="px-4 pt-2 pb-2 flex justify-between text-xs text-gray-600">
            <span>Prepared by Crewless | runcrewless.com</span>
            <span>CONFIDENTIAL</span>
          </div>

          {/* Detail Panel */}
          {selectedNode && (
            <DetailPanel node={selectedNode} onClose={() => setSelectedNode(null)} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
