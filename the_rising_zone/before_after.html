<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rising Zone — Before/After Automation</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .transition-all { transition: all 0.3s ease; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // =========================================================
    // DATA — The Rising Zone
    // =========================================================
    const CLIENT = {
      name: "The Rising Zone",
      industry: "Wellness + Coworking | Rocklin, CA",
      auditDate: "March 2026",
    };

    // Summary stats
    const SUMMARY = {
      hoursFreedPerWeek: 33,
      annualSavings: "$150,270",
      processesAutomated: 12,
      paybackMonths: 4.8,
    };

    // 8 most impactful process transformations
    const PROCESSES = [
      {
        name: "B2B/B2G Outbound",
        icon: "\uD83C\uDFAF",
        category: "Sales",
        current: { label: "Target accounts in Yvonne's head only", value: "0 outreach", unit: "automated", cost: "$46,800/yr" },
        after:   { label: "Automated sequences to first responders & businesses", value: "100+ contacts/mo", unit: "automated", cost: "$11,700/yr" },
        savings: "$35,100/yr",
        hoursWeek: 6,
      },
      {
        name: "Lead Follow-Up",
        icon: "\uD83D\uDCDE",
        category: "Sales",
        current: { label: "Manual calls/emails, no sequences", value: "Unknown", unit: "response time", cost: "$39,000/yr" },
        after:   { label: "Instant auto-response + drip sequences", value: "< 5 min", unit: "response time", cost: "$7,800/yr" },
        savings: "$31,200/yr",
        hoursWeek: 5,
      },
      {
        name: "Member Retention",
        icon: "\uD83D\uDD04",
        category: "Sales",
        current: { label: "No lapse detection, no save flows", value: "Unknown", unit: "churn rate", cost: "$23,400/yr" },
        after:   { label: "30/60/90 day check-ins + cancellation saves", value: "Automated", unit: "retention engine", cost: "$5,850/yr" },
        savings: "$17,550/yr",
        hoursWeek: 3,
      },
      {
        name: "Reporting & Dashboard",
        icon: "\uD83D\uDCCA",
        category: "Operations",
        current: { label: "Manual compilation from MindBody", value: "3 hrs/wk", unit: "owner time", cost: "$23,400/yr" },
        after:   { label: "Real-time automated dashboard", value: "Always on", unit: "instant access", cost: "$7,020/yr" },
        savings: "$16,380/yr",
        hoursWeek: 3,
      },
      {
        name: "Tour Scheduling",
        icon: "\uD83D\uDCC5",
        category: "Admin",
        current: { label: "Phone/email back & forth", value: "2-3 days", unit: "to confirm", cost: "$3,432/yr" },
        after:   { label: "Self-serve calendar booking", value: "Instant", unit: "booking", cost: "$343/yr" },
        savings: "$3,089/yr",
        hoursWeek: 3,
      },
      {
        name: "Registration & Intake",
        icon: "\uD83D\uDCCB",
        category: "Admin",
        current: { label: "Manual entry into MindBody", value: "4 hrs/wk", unit: "admin time", cost: "$4,576/yr" },
        after:   { label: "Digital forms auto-populate records", value: "< 30 min", unit: "per member", cost: "$1,373/yr" },
        savings: "$3,203/yr",
        hoursWeek: 4,
      },
      {
        name: "Social Media & Content",
        icon: "\u270D\uFE0F",
        category: "Marketing",
        current: { label: "Manual creation without AI templates", value: "5 hrs/wk", unit: "marketing time", cost: "$8,320/yr" },
        after:   { label: "AI-assisted with template library", value: "2.5 hrs/wk", unit: "marketing time", cost: "$4,160/yr" },
        savings: "$4,160/yr",
        hoursWeek: 5,
      },
      {
        name: "Ops Task Management",
        icon: "\u2699\uFE0F",
        category: "Operations",
        current: { label: "Manual task assignment & follow-up", value: "3 hrs/wk", unit: "manager time", cost: "$7,488/yr" },
        after:   { label: "Digital boards + automated checklists", value: "1.2 hrs/wk", unit: "manager time", cost: "$2,995/yr" },
        savings: "$4,493/yr",
        hoursWeek: 3,
      },
    ];

    // Financial summary
    const FINANCIALS = {
      implementationCost: "$60,000",
      paybackPeriod: "4.8 months",
      year1ROI: "291%",
      year3NetBenefit: "$1,244,810",
    };

    // 3-phase timeline
    const PHASES = [
      { phase: "Phase 1", name: "Sales Infrastructure", timeline: "Month 1\u20132", cost: "$16,000", savings: "$92,087/yr", items: ["CRM + Pipeline", "B2B/B2G Outbound", "Lead Follow-Up", "Retention", "Tour Scheduling", "Waivers", "Registration"] },
      { phase: "Phase 2", name: "Operations Foundation", timeline: "Month 2\u20134", cost: "$12,500", savings: "$32,188/yr", items: ["Dashboard", "Task Management", "Content", "Communication", "Booking"] },
      { phase: "Phase 3", name: "Custom Platform", timeline: "Month 4\u20138", cost: "$31,500", savings: "$25,995/yr", items: ["MindBody Replacement", "AI Features", "Staff Scheduling"] },
    ];

    // =========================================================
    // COMPONENT
    // =========================================================
    const { useState } = React;

    const fmt = (n) => typeof n === "number" ? `$${n.toLocaleString()}` : n;

    function StatBadge({ label, value, accent }) {
      return (
        <div className={`rounded-xl p-4 text-center border-2 ${accent}`}>
          <div className="text-2xl font-bold">{value}</div>
          <div className="text-xs mt-1 opacity-75">{label}</div>
        </div>
      );
    }

    function ProcessCard({ proc, isAfter }) {
      const state = isAfter ? proc.after : proc.current;
      const theme = isAfter
        ? { card: "bg-green-950 border-green-700", badge: "bg-green-800 text-green-200", value: "text-green-400", savings: "text-green-300" }
        : { card: "bg-red-950 border-red-800",   badge: "bg-red-900 text-red-200",   value: "text-red-400",   savings: "text-gray-400" };

      return (
        <div className={`rounded-xl border p-4 ${theme.card} flex flex-col gap-2`}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-xl">{proc.icon}</span>
              <span className="font-semibold text-white text-sm">{proc.name}</span>
            </div>
            <span className={`text-xs px-2 py-0.5 rounded-full ${theme.badge}`}>{proc.category}</span>
          </div>
          <div className="text-xs text-gray-400">{state.label}</div>
          <div className={`text-2xl font-bold ${theme.value}`}>{state.value}</div>
          <div className="text-xs text-gray-500">{state.unit}</div>
          <div className="flex items-center justify-between mt-1 pt-2 border-t border-gray-700">
            <span className="text-xs text-gray-400">Annual cost</span>
            <span className={`text-sm font-semibold ${isAfter ? "text-green-400" : "text-red-400"}`}>{state.cost}</span>
          </div>
          {isAfter && (
            <div className="flex items-center justify-between">
              <span className="text-xs text-gray-400">Savings</span>
              <span className={`text-sm font-bold ${theme.savings}`}>{proc.savings}</span>
            </div>
          )}
        </div>
      );
    }

    function PhaseCard({ phase, delay }) {
      const colors = { "Phase 1": "border-teal-500", "Phase 2": "border-blue-500", "Phase 3": "border-purple-500" };
      const bg    = { "Phase 1": "bg-teal-900",      "Phase 2": "bg-blue-900",     "Phase 3": "bg-purple-900" };
      return (
        <div className={`rounded-xl border-2 p-4 bg-gray-900 ${colors[phase.phase]}`}>
          <div className="flex items-center gap-2 mb-2">
            <span className={`text-xs font-bold px-2 py-0.5 rounded-full text-white ${bg[phase.phase]}`}>{phase.phase}</span>
            <span className="text-sm font-semibold text-white">{phase.name}</span>
            <span className="text-xs text-gray-400 ml-auto">{phase.timeline}</span>
          </div>
          <div className="flex gap-4 text-xs mb-3">
            <div><span className="text-gray-400">Investment: </span><span className="text-white font-semibold">{phase.cost}</span></div>
            <div><span className="text-gray-400">Savings: </span><span className="text-green-400 font-semibold">{phase.savings}</span></div>
          </div>
          <div className="flex flex-wrap gap-1">
            {phase.items.map(item => (
              <span key={item} className="text-xs bg-gray-800 text-gray-300 px-2 py-0.5 rounded">{item}</span>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [isAfter, setIsAfter] = useState(false);

      return (
        <div className="min-h-screen bg-gray-950 text-white">

          {/* Header */}
          <div className={`py-5 px-6 ${isAfter ? "bg-green-900" : "bg-red-900"} transition-all`}>
            <div className="max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-4">
              <div>
                <div className="text-xs text-gray-300 mb-0.5">Crewless — Automation Audit</div>
                <h1 className="text-2xl font-bold">{CLIENT.name}</h1>
                <div className="text-sm text-gray-300">{CLIENT.industry} | {CLIENT.auditDate}</div>
              </div>
              <button
                onClick={() => setIsAfter(!isAfter)}
                className={`px-6 py-3 rounded-xl font-bold text-sm transition-all shadow-lg
                  ${isAfter
                    ? "bg-green-500 hover:bg-green-400 text-white"
                    : "bg-red-500 hover:bg-red-400 text-white"}`}
              >
                {isAfter ? "\u2705 Showing: After Automation" : "\uD83D\uDD34 Showing: Current State"}
                <span className="ml-2 text-xs opacity-75">(click to toggle)</span>
              </button>
            </div>
          </div>

          {/* Summary Stats */}
          <div className="max-w-7xl mx-auto px-6 py-6">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
              <StatBadge
                label="Hours Freed / Week"
                value={`${SUMMARY.hoursFreedPerWeek} hrs`}
                accent={isAfter ? "border-green-600 text-green-300 bg-green-950" : "border-gray-600 text-gray-400 bg-gray-900"}
              />
              <StatBadge
                label="Annual Savings"
                value={SUMMARY.annualSavings}
                accent={isAfter ? "border-green-600 text-green-300 bg-green-950" : "border-gray-600 text-gray-400 bg-gray-900"}
              />
              <StatBadge
                label="Processes Automated"
                value={`${SUMMARY.processesAutomated} of 12`}
                accent={isAfter ? "border-green-600 text-green-300 bg-green-950" : "border-gray-600 text-gray-400 bg-gray-900"}
              />
              <StatBadge
                label="Payback Period"
                value={`${SUMMARY.paybackMonths} mo`}
                accent={isAfter ? "border-green-600 text-green-300 bg-green-950" : "border-gray-600 text-gray-400 bg-gray-900"}
              />
            </div>

            {/* Section Label */}
            <div className="flex items-center gap-3 mb-4">
              <div className={`w-3 h-3 rounded-full ${isAfter ? "bg-green-500" : "bg-red-500"}`}></div>
              <h2 className="text-lg font-bold">
                {isAfter ? "After Automation — Projected State" : "Current State — Manual Operations"}
              </h2>
            </div>

            {/* Process Cards Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              {PROCESSES.map((proc) => (
                <ProcessCard key={proc.name} proc={proc} isAfter={isAfter} />
              ))}
            </div>

            {/* Financial Impact */}
            <div className="rounded-2xl border border-gray-700 bg-gray-900 p-6 mb-6">
              <h3 className="text-base font-bold mb-4 text-gray-200">Financial Impact</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {[
                  { label: "Implementation Cost", value: FINANCIALS.implementationCost, color: "text-yellow-400" },
                  { label: "Payback Period",       value: FINANCIALS.paybackPeriod,      color: "text-blue-400" },
                  { label: "Year 1 ROI",           value: FINANCIALS.year1ROI,           color: "text-green-400" },
                  { label: "3-Year Net Benefit",   value: FINANCIALS.year3NetBenefit,    color: "text-green-300" },
                ].map(({ label, value, color }) => (
                  <div key={label} className="text-center">
                    <div className={`text-xl font-bold ${color}`}>{value}</div>
                    <div className="text-xs text-gray-400 mt-1">{label}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Implementation Timeline — after view only */}
            {isAfter && (
              <div>
                <h3 className="text-base font-bold mb-4 text-gray-200">Implementation Timeline</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {PHASES.map((phase) => (
                    <PhaseCard key={phase.phase} phase={phase} />
                  ))}
                </div>
              </div>
            )}

            {/* Footer */}
            <div className="mt-8 pt-4 border-t border-gray-800 flex items-center justify-between text-xs text-gray-500">
              <span>Prepared by Crewless | crewless.ai</span>
              <span>CONFIDENTIAL</span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
